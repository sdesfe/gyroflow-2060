on:
  push:
    branches: [ fpsup-2060-v4 ]
  workflow_dispatch:
name: fpSup 2060 Windows build

permissions:
  contents: write

jobs:
  build:
    name: fpSup 2060 plugin for Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/target
            C:\Users\runneradmin\.cargo
          key: windows-fpsup2060-0
      - name: Prepare Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@main
        with:
          vulkan-query-version: 1.3.204.0
          vulkan-components: Vulkan-Headers
          vulkan-use-cache: true
      - uses: extractions/setup-just@v2
      - name: Build plugin
        run: |
          just install-deps
          just ofx deploy
      - uses: actions/upload-artifact@v4
        with:
          name: fpSup2060v4-OpenFX-windows
          path: target/fpSup2060v4-OpenFX-windows.zip
      - name: Save the plugin zip to the builds branch
        shell: bash
        run: |
          mkdir -p /tmp/out && cp target/fpSup2060v4-OpenFX-windows.zip /tmp/out/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin builds || true
          if git rev-parse --verify origin/builds >/dev/null 2>&1; then git checkout -B builds origin/builds; else git checkout --orphan builds; git rm -rf . >/dev/null; fi
          cp /tmp/out/fpSup2060v4-OpenFX-windows.zip .
          git add fpSup2060v4-OpenFX-windows.zip
          git commit -m "fpSup 2060 v4 build ${GITHUB_SHA::7}"
          git push origin builds
